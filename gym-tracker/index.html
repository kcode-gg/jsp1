<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0B0D12" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F1F3F8" media="(prefers-color-scheme: light)">
  <title>Gym Tracker</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="gym-tracker.css">
  <style>
    html, body { height: 100%; margin: 0; }
    body { background: var(--gt-bg); }
    #gym { height: 100%; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; }
  </style>
</head>
<body>
  <div id="gym"></div>
  <script src="gym-tracker.js"></script>
  <script>
    GymTracker.mount(document.getElementById('gym'));
  </script>
</body>
</html>
